<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .preview img {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .image-info {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sick or not Sick</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" id="file" multiple accept="image/*" required>
            <br><br>
            <button type="submit">Process Images</button>
        </form>

        {% if images_info %}
            <h2>Results</h2>
            <div class="preview">
                {% for image in images_info %}
                    <div>
                        <img src="{{ image.data_uri }}" alt="">
                        <div class="image-info">
                            <strong>state:</strong> {{ image.result }}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
