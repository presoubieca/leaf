<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ebffed;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="file"] {
            padding: 8px;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .preview {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .preview div {
            text-align: center;
        }

        .preview img {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .image-info {
            margin-top: 8px;
            font-size: 15px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sick or not Sick</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" id="file" multiple accept="image/*" required>
            <button type="submit">Process Images</button>
        </form>

        {% if images_info %}
            <h2>Results</h2>
            <div class="preview">
                {% for image in images_info %}
                    <div>
                        <img src="{{ image.data_uri }}" alt="Leaf Image">
                        <div class="image-info">
                            <strong>Status:</strong> {{ image.result }}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
